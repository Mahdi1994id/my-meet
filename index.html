<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mahdi Call - گروهی</title>
    <style>
        :root { 
            --bg: #0b0c10; --surface: #1f2833; --primary: #45f3ff; 
            --danger: #ff4a5a; --success: #2ec4b6; --text: #ffffff; 
            --header-h: 70px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; outline: none; }
        body { background-color: var(--bg); color: var(--text); height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }

        #settings { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11,12,16,0.98); z-index: 300; display: flex; justify-content: center; align-items: center; padding: 15px; overflow-y: auto; }
        .card { background: var(--surface); padding: 30px; border-radius: 24px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; border: 1px solid #2f3e46; }
        h2 { margin-bottom: 15px; font-weight: 700; color: var(--primary); font-size: 1.3rem; }
        p { color: #aaa; font-size: 0.85rem; margin-bottom: 20px; line-height: 1.5; }
        input, select { width: 100%; padding: 15px; background: #0b0c10; border: 1px solid #2f3e46; color: white; border-radius: 12px; margin-bottom: 15px; font-size: 1rem; text-align: center; }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: rgba(0,0,0,0.2); padding: 12px 15px; border-radius: 12px; }
        
        .switch { position: relative; display: inline-block; width: 46px; height: 26px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(20px); }

        .btn-start { width: 100%; padding: 16px; background: var(--primary); color: #0b0c10; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(69, 243, 255, 0.3); }
        #status-msg { text-align: center; color: #45f3ff; font-size: 0.85rem; margin-top: 15px; font-weight: bold; }

        #app { display: none; width: 100%; height: 100%; flex-direction: column; position: relative; }
        .controls-bar { height: var(--header-h); background: rgba(31, 40, 51, 0.95); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; gap: 15px; z-index: 100; border-bottom: 1px solid #2f3e46; position: relative; padding: 0 80px; }
        .room-badge { position: absolute; right: 20px; background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; color: #fff; cursor: pointer; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
        .peer-count { position: absolute; left: 20px; background: rgba(46,196,182,0.2); padding: 6px 14px; border-radius: 16px; font-size: 0.8rem; color: var(--success); }
        
        .ctrl-btn { width: 48px; height: 48px; min-width: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.18); color: white; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: 0.2s; flex-shrink: 0; }
        .ctrl-btn.off { background: var(--danger); border-color: transparent; }
        .ctrl-btn.active { background: var(--success); color: white; border-color: transparent; }

        .main-container { flex: 1; display: flex; width: 100%; overflow: hidden; position: relative; }
        #video-grid { flex: 1; display: flex; padding: 15px; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; background: #0b0c10; overflow-y: auto; position: relative; align-content: center; }
        .video-card { position: relative; background: #1f2833; border-radius: 14px; overflow: hidden; border: 2px solid #2f3e46; min-width: 160px; flex: 1 1 30%; max-width: 500px; height: 280px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); cursor: pointer; transition: transform 0.2s, border-color 0.15s, box-shadow 0.15s; }
        
        .video-card.speaking { border-color: var(--success); box-shadow: 0 0 20px rgba(46, 196, 182, 0.6), 0 8px 24px rgba(0,0,0,0.3); }

        .video-card.fullscreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            max-width: 100%; min-width: 100%; z-index: 200; border-radius: 0; border: none;
        }

        video { width: 100%; height: 100%; object-fit: cover; background: #000; }
        .video-card.fullscreen video { object-fit: contain; }
        
        #card-local video { transform: scaleX(-1); }
        #card-local.fullscreen video { transform: none; } 

        .name-tag { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 5px 12px; border-radius: 8px; font-size: 0.8rem; color: white; z-index: 10; pointer-events: none; }

        .conn-status { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); font-size: 0.65rem; padding: 3px 10px; border-radius: 10px; z-index: 10; pointer-events: none; white-space: nowrap; }
        .conn-status.retrying { color: #f0ad4e; background: rgba(240,173,78,0.2); }
        .conn-status.ok { color: var(--success); background: rgba(46,196,182,0.15); }
        .conn-status.fail { color: var(--danger); background: rgba(255,74,90,0.15); }

        @media (max-width: 1024px) {
            .controls-bar { padding: 0 70px; gap: 10px; }
            .ctrl-btn { width: 44px; height: 44px; min-width: 44px; font-size: 1.1rem; }
            .video-card { flex: 1 1 45%; max-width: 45%; height: 240px; }
        }

        @media (max-width: 768px) {
            :root { --header-h: 60px; }
            #settings { padding: 10px; }
            .card { padding: 22px 20px; border-radius: 18px; }
            h2 { font-size: 1.15rem; }
            input, select { padding: 13px; font-size: 0.95rem; }
            .row { padding: 10px 13px; font-size: 0.9rem; }
            .btn-start { padding: 14px; font-size: 1rem; }
            .controls-bar { padding: 0 8px; gap: 6px; justify-content: center; }
            .ctrl-btn { width: 40px; height: 40px; min-width: 40px; font-size: 1rem; }
            .room-badge { font-size: 0.72rem; padding: 6px 10px; right: 8px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
            .peer-count { left: 8px; font-size: 0.7rem; padding: 5px 10px; }
            #video-grid { padding: 8px; gap: 6px; }
            .video-card { min-width: unset; flex: 1 1 100%; max-width: 100%; height: calc(100% / 4 - 8px); min-height: 120px; border-radius: 10px; }
            .main-container { flex-direction: column; }
            .name-tag { font-size: 0.7rem; padding: 4px 8px; bottom: 6px; right: 6px; }
        }

        @media (max-width: 380px) {
            .controls-bar { gap: 4px; padding: 0 4px; }
            .ctrl-btn { width: 36px; height: 36px; min-width: 36px; font-size: 0.9rem; }
            .room-badge { font-size: 0.65rem; padding: 5px 8px; max-width: 90px; }
            .card { padding: 18px 15px; }
        }

        @media (max-width: 900px) and (orientation: landscape) and (max-height: 500px) {
            :root { --header-h: 50px; }
            .video-card { min-height: 100px; height: 100%; flex: 1 1 50%; }
            #video-grid { padding: 6px; }
        }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<div id="settings">
    <div class="card">
        <h2>اتاق تماس گروهی (تا ۱۰ نفر)</h2>
        <p id="welcome-note">نام خود را وارد کنید. اگر با لینک دعوت آمده‌اید، مستقیم دکمه ورود را بزنید.</p>
        
        <input type="text" id="username-input" placeholder="نام شما" autocomplete="off">
        <input type="hidden" id="target-peer-id">

        <div class="row">
            <span>🎙️ میکروفون</span>
            <label class="switch"><input type="checkbox" id="opt-mic" checked><span class="slider"></span></label>
        </div>

        <div class="row" style="flex-direction: column; align-items: stretch; gap: 8px;">
            <div style="display: flex; justify-content: space-between; width: 100%;">
                <span>📷 دوربین</span>
                <label class="switch"><input type="checkbox" id="opt-cam" checked onchange="document.getElementById('camera-select-wrapper').style.display = this.checked ? 'block' : 'none'"><span class="slider"></span></label>
            </div>
            <div id="camera-select-wrapper" style="margin-top: 5px;">
                <select id="video-source"></select>
            </div>
        </div>

        <button class="btn-start" id="btn-submit" onclick="initPeer()">ورود به تماس</button>
        <div id="status-msg"></div>
    </div>
</div>

<div id="app">
    <div class="controls-bar">
        <div class="room-badge" onclick="copyRoomLink()">کپی لینک دعوت <i class="fas fa-link"></i></div>
        <div class="peer-count" id="peer-count"></div>
        <button class="ctrl-btn" id="btn-mic" onclick="toggleAudio()"><i class="fas fa-microphone"></i></button>
        <button class="ctrl-btn" id="btn-cam" onclick="toggleVideo()"><i class="fas fa-video"></i></button>
        <button class="ctrl-btn" id="btn-screen" onclick="toggleScreen()"><i class="fas fa-desktop"></i></button>
        <button class="ctrl-btn off" onclick="location.reload()"><i class="fas fa-phone-slash"></i></button>
    </div>
    
    <div class="main-container">
        <div id="video-grid"></div>
    </div>
</div>

<script>
    // ==================== VARIABLES ====================
    let myStream, peer, myId, targetPeerId = null, myName;
    let isScreenSharing = false, screenStream;
    const connectedPeers = {};   // peerId -> MediaConnection
    const dataConns = {};        // peerId -> DataConnection (for mesh discovery)
    let audioCtx = null;
    const speakingDetectors = {};
    let isHost = false;

    // ==================== ICE SERVERS (Free Only) ====================
    const peerConfig = {
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' },
                { urls: 'stun:stun.cloudflare.com:3478' },
                { urls: 'stun:stun.fbsbx.com:3478' },
                { urls: 'stun:stun.stunprotocol.org:3478' },
                { urls: 'stun:stunserver2024.stunprotocol.org:3478' },
                { urls: 'stun:stun.nextcloud.com:3478' },
                { urls: 'stun:stun.86dd.eu:3478' },
                {
                    urls: ['turn:turn.evan-brass.net:3478', 'turn:turn.evan-brass.net:3478?transport=tcp'],
                    username: 'user', credential: 'password'
                }
            ],
            iceCandidatePoolSize: 10
        }
    };

    // ==================== INIT ====================
    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('invite')) {
            targetPeerId = params.get('invite');
            document.getElementById('target-peer-id').value = targetPeerId;
            document.getElementById('welcome-note').innerText = "شما دعوت شده‌اید! نام خود را وارد کرده و ورود بزنید.";
            document.getElementById('welcome-note').style.color = "#2ec4b6";
        }
        navigator.mediaDevices.enumerateDevices().then(devices => {
            const sel = document.getElementById('video-source');
            devices.forEach(d => {
                if (d.kind === 'videoinput') {
                    const opt = document.createElement('option');
                    opt.value = d.deviceId;
                    opt.textContent = d.label || ('دوربین ' + (sel.options.length + 1));
                    sel.appendChild(opt);
                }
            });
        }).catch(() => {});
    };

    function copyRoomLink() {
        const link = window.location.origin + window.location.pathname + '?invite=' + myId;
        navigator.clipboard.writeText(link).then(() => alert('لینک دعوت کپی شد:\n' + link));
    }

    function showConnStatus(text, type) {
        let el = document.getElementById('conn-indicator');
        if (!el) {
            el = document.createElement('div');
            el.id = 'conn-indicator';
            el.className = 'conn-status';
            document.querySelector('.controls-bar').appendChild(el);
        }
        el.className = 'conn-status ' + type;
        el.innerText = text;
    }

    function hideConnStatus() {
        const el = document.getElementById('conn-indicator');
        if (el) el.remove();
    }

    function updatePeerCount() {
        // Count actual remote video cards (everything except card-local)
        const allCards = document.querySelectorAll('#video-grid .video-card');
        const remoteCount = Array.from(allCards).filter(c => c.id !== 'card-local').length;
        const el = document.getElementById('peer-count');
        if (el) el.innerText = remoteCount > 0 ? (remoteCount + ' نفر') : 'منتظر دیگران...';
    }

    // Also refresh count periodically to stay in sync
    setInterval(updatePeerCount, 3000);

    function extractNameFromId(peerId) {
        try { return decodeURIComponent(peerId.split('_name_')[1]) || "کاربر"; } catch(e) { return "کاربر"; }
    }

    // ==================== CURRENT STREAM ====================
    // Returns what we should send right now (screen+mic if sharing, else camera+mic)
    function buildCurrentStream() {
        if (isScreenSharing && screenStream && screenStream.getVideoTracks().length > 0) {
            const s = new MediaStream();
            s.addTrack(screenStream.getVideoTracks()[0]);
            if (myStream.getAudioTracks().length > 0) s.addTrack(myStream.getAudioTracks()[0]);
            return s;
        }
        return myStream;
    }

    // ==================== SPEAKING DETECTOR ====================
    function setupSpeakingDetector(id, stream) {
        if (!stream || !stream.getAudioTracks().length) return;
        if (speakingDetectors[id]) { speakingDetectors[id].stop(); delete speakingDetectors[id]; }
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512; analyser.smoothingTimeConstant = 0.6;
        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        const buf = new Uint8Array(analyser.frequencyBinCount);
        let active = true;
        (function loop() {
            if (!active) return;
            analyser.getByteFrequencyData(buf);
            let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i];
            const card = document.getElementById(id);
            if (card) card.classList.toggle('speaking', (sum / buf.length) > 12);
            requestAnimationFrame(loop);
        })();
        speakingDetectors[id] = { stop: () => { active = false; source.disconnect(); } };
    }

    // ==================== DATA CONNECTION (Mesh Discovery) ====================
    // Lightweight DataConnection used ONLY to discover other peers in the room.
    // When a new peer connects, the existing peer sends them the list of other peers.
    // The new peer then calls each peer on that list → full mesh.

    function handleDataConnection(conn) {
        conn.on('open', () => {
            dataConns[conn.peer] = conn;
            console.log('[Data] open with', conn.peer);

            // Send the list of OTHER peers I'm connected to
            const others = Object.keys(connectedPeers).filter(id => id !== conn.peer);
            if (others.length > 0) {
                console.log('[Data] sending peer list to', conn.peer, ':', others);
                try { conn.send({ type: 'peer-list', peers: others }); } catch(e) {}
            }
        });

        conn.on('data', (data) => {
            if (!data) return;
            if (data.type === 'peer-list') {
                console.log('[Data] got peer list:', data.peers);
                (data.peers || []).forEach(pid => connectToPeerIfNeeded(pid));
            }
        });

        conn.on('close', () => { delete dataConns[conn.peer]; });
        conn.on('error', () => { delete dataConns[conn.peer]; });
    }

    function connectToPeerIfNeeded(peerId) {
        if (connectedPeers[peerId] || peerId === myId) return;
        console.log('[Mesh] connecting to', peerId);
        makeCallWithRetry(peerId, buildCurrentStream(), 0, false);
        // Open data connection for future discovery
        if (!dataConns[peerId]) {
            const dc = peer.connect(peerId, { reliable: true });
            handleDataConnection(dc);
        }
    }

    // ==================== PEER INIT ====================
    async function initPeer() {
        myName = document.getElementById('username-input').value.trim() || "کاربر ناشناس";
        targetPeerId = document.getElementById('target-peer-id').value || null;
        isHost = !targetPeerId;

        const submitBtn = document.getElementById('btn-submit');
        submitBtn.disabled = true;
        document.getElementById('status-msg').innerText = "در حال اتصال...";

        try {
            const wantCam = document.getElementById('camera-select-wrapper').style.display !== 'none';
            const wantMic = document.getElementById('opt-mic').checked;
            const camId = document.getElementById('video-source').value;

            myStream = await navigator.mediaDevices.getUserMedia({
                audio: wantMic ? { echoCancellation: true, noiseSuppression: true, autoGainControl: true, sampleRate: 48000, channelCount: 1 } : false,
                video: wantCam ? { deviceId: camId ? { exact: camId } : undefined } : false
            });

            let savedId = localStorage.getItem('mahdi_call_peer_id');
            if (!savedId) {
                savedId = "user_" + Math.random().toString(36).substr(2, 9) + "_name_" + encodeURIComponent(myName);
            } else {
                savedId = savedId.split('_name_')[0] + "_name_" + encodeURIComponent(myName);
            }
            localStorage.setItem('mahdi_call_peer_id', savedId);
            myId = savedId;

            peer = new Peer(myId, peerConfig);

            // --- Peer is open ---
            peer.on('open', () => {
                document.getElementById('settings').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                addVideoTrack('card-local', myStream, myName + " (شما)", true);
                setupSpeakingDetector('card-local', myStream);
                updatePeerCount();

                if (targetPeerId) {
                    showConnStatus('در حال اتصال...', 'retrying');
                    // Call the host
                    makeCallWithRetry(targetPeerId, buildCurrentStream(), 0, true);
                    // Open data connection for mesh discovery
                    const dc = peer.connect(targetPeerId, { reliable: true });
                    handleDataConnection(dc);
                }
            });

            // --- Incoming call (anyone can call us) ---
            peer.on('call', (incomingCall) => {
                const pid = incomingCall.peer;
                const oldCall = connectedPeers[pid];
                console.log('[Incoming] call from', extractNameFromId(pid), '(replacing:', !!oldCall, ')');

                // Update connectedPeers FIRST so old close handler won't remove video
                connectedPeers[pid] = incomingCall;
                updatePeerCount();

                // Answer with current stream (screen if sharing, else camera)
                incomingCall.answer(buildCurrentStream());
                setupCallListeners(incomingCall, pid);

                // Safe close old call
                if (oldCall) { try { oldCall.close(); } catch(e) {} }

                // Notify all OTHER data-connected peers about the new peer
                Object.entries(dataConns).forEach(([id, conn]) => {
                    if (id !== pid) {
                        try { conn.send({ type: 'peer-list', peers: [pid] }); } catch(e) {}
                    }
                });
            });

            // --- Incoming data connection ---
            peer.on('connection', (conn) => {
                handleDataConnection(conn);
            });

            // --- Errors ---
            peer.on('error', (err) => {
                console.error('[Peer] error:', err.type, err);
                if (err.type === 'unavailable-id') {
                    alert('این شناسه قبلا گرفته شده. صفحه را رفرش کنید.');
                    localStorage.removeItem('mahdi_call_peer_id');
                } else if (err.type === 'network' || err.type === 'server-error') {
                    alert('خطای شبکه. صفحه را رفرش کنید.');
                }
                // peer-unavailable handled by retry mechanism
            });

            peer.on('disconnected', () => {
                console.warn('[Peer] signaling disconnected');
                if (!peer.destroyed) peer.reconnect();
            });

        } catch (err) {
            alert("خطا: " + err.message);
            submitBtn.disabled = false;
        }
    }

    // ==================== CALL HANDLING ====================
    function setupCallListeners(call, peerId) {
        call.on('stream', (remoteStream) => {
            console.log('[Call] stream from', extractNameFromId(peerId));
            addVideoTrack(peerId, remoteStream, extractNameFromId(peerId), false);
            setupSpeakingDetector(peerId, remoteStream);
            hideConnStatus();
        });
        call.on('close', () => {
            // Only remove video if this is still the active call
            if (connectedPeers[peerId] === call) {
                console.log('[Call] closed:', extractNameFromId(peerId));
                removeVideoTrack(peerId);
                updatePeerCount();
            }
        });
        call.on('error', (err) => console.error('[Call] error:', peerId, err));
    }

    function makeCallWithRetry(peerId, stream, attempt, showAlert) {
        const maxRetries = 3;
        const maxWait = 6000;

        console.log('[Call] attempt', attempt + 1, 'to', extractNameFromId(peerId));
        if (showAlert) showConnStatus(attempt > 0 ? ('تلاش ' + (attempt+1) + '...') : 'در حال اتصال...', 'retrying');

        const call = peer.call(peerId, stream);
        if (!call) {
            if (attempt < maxRetries - 1) setTimeout(() => makeCallWithRetry(peerId, stream, attempt + 1, showAlert), 1500);
            else if (showAlert) showConnStatus('اتصال برقرار نشد', 'fail');
            return;
        }

        let resolved = false;

        const onSuccess = (remoteStream) => {
            if (resolved) return; resolved = true;
            console.log('[Call] connected to', extractNameFromId(peerId));
            connectedPeers[peerId] = call;
            updatePeerCount();
            addVideoTrack(peerId, remoteStream, extractNameFromId(peerId), false);
            setupSpeakingDetector(peerId, remoteStream);
            if (showAlert) hideConnStatus();
        };

        const onFail = (reason) => {
            if (resolved) return; resolved = true;
            console.warn('[Call] failed:', reason);
            try { call.close(); } catch(e) {}
            if (attempt < maxRetries - 1) {
                setTimeout(() => makeCallWithRetry(peerId, stream, attempt + 1, showAlert), 1500 + attempt * 1000);
            } else if (showAlert) {
                showConnStatus('اتصال برقرار نشد', 'fail');
            }
        };

        call.on('stream', onSuccess);
        call.on('close', () => { if (!resolved) onFail('closed'); });
        call.on('error', (err) => onFail(err.type || 'error'));
        setTimeout(() => { if (!resolved) onFail('timeout'); }, maxWait);
    }

    // ==================== VIDEO GRID ====================
    function addVideoTrack(id, stream, label, isLocal) {
        const existing = document.getElementById(id);
        if (existing) {
            const vid = existing.querySelector('video');
            if (vid && vid.srcObject !== stream) vid.srcObject = stream;
            return;
        }
        const grid = document.getElementById('video-grid');
        const card = document.createElement('div');
        card.className = 'video-card'; card.id = id;
        card.onclick = function() {
            const fs = this.classList.contains('fullscreen');
            document.querySelectorAll('.video-card').forEach(c => c.classList.remove('fullscreen'));
            if (!fs) this.classList.add('fullscreen');
        };
        const video = document.createElement('video');
        video.autoplay = true; video.playsInline = true;
        if (isLocal) video.muted = true;
        video.srcObject = stream;
        const tag = document.createElement('div');
        tag.className = 'name-tag'; tag.innerText = label;
        card.appendChild(video); card.appendChild(tag); grid.appendChild(card);
    }

    function removeVideoTrack(id) {
        const card = document.getElementById(id);
        if (card) card.remove();
        delete connectedPeers[id];
        if (speakingDetectors[id]) { speakingDetectors[id].stop(); delete speakingDetectors[id]; }
    }

    // ==================== AUDIO / VIDEO TOGGLE ====================
    function toggleAudio() {
        const t = myStream.getAudioTracks()[0];
        if (t) { t.enabled = !t.enabled; document.getElementById('btn-mic').classList.toggle('off', !t.enabled); }
    }

    function toggleVideo() {
        const t = myStream.getVideoTracks()[0];
        if (t) { t.enabled = !t.enabled; document.getElementById('btn-cam').classList.toggle('off', !t.enabled); }
    }

    // ==================== SCREEN SHARE (Safe Recall) ====================
    async function toggleScreen() {
        const btn = document.getElementById('btn-screen');
        if (!isScreenSharing) {
            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const screenTrack = screenStream.getVideoTracks()[0];
                console.log('[Screen] got track:', screenTrack.label);

                // Update local preview
                const localVid = document.querySelector('#card-local video');
                if (localVid) localVid.srcObject = screenStream;
                document.getElementById('card-local').style.transform = "none";

                const sendStream = new MediaStream();
                sendStream.addTrack(screenTrack);
                if (myStream.getAudioTracks().length > 0) sendStream.addTrack(myStream.getAudioTracks()[0]);

                // Try replaceTrack or safe recall for each peer
                const entries = Object.entries(connectedPeers);
                for (const [pid, call] of entries) {
                    await switchToScreen(pid, call, sendStream, screenTrack);
                }

                isScreenSharing = true;
                btn.classList.add('active');
                screenTrack.onended = () => stopScreenSharing();
            } catch (e) {
                console.error('[Screen] error:', e);
            }
        } else {
            await stopScreenSharing();
        }
    }

    async function switchToScreen(peerId, existingCall, sendStream, screenTrack) {
        // Method 1: replaceTrack (best - no reconnect, audio stays)
        try {
            const pc = existingCall.peerConnection;
            if (pc && pc.getSenders) {
                const vs = pc.getSenders().find(s => s.track && s.track.kind === 'video');
                if (vs) {
                    await vs.replaceTrack(screenTrack);
                    console.log('[Screen] replaceTrack OK for', extractNameFromId(peerId));
                    return;
                }
            }
        } catch (e) {
            console.warn('[Screen] replaceTrack failed:', e.message || e);
        }

        // Method 2: Safe Recall (new call first, close old only after confirmed)
        console.log('[Screen] safe recall for', extractNameFromId(peerId));
        showConnStatus('اشتراک صفحه...', 'retrying');

        const newCall = peer.call(peerId, sendStream);
        if (!newCall) { showConnStatus('اشتراک صفحه شکست', 'fail'); return; }

        let done = false;
        newCall.on('stream', (rs) => {
            if (done) return; done = true;
            connectedPeers[peerId] = newCall;
            try { existingCall.close(); } catch(e) {}
            addVideoTrack(peerId, rs, extractNameFromId(peerId), false);
            setupSpeakingDetector(peerId, rs);
            hideConnStatus();
        });
        newCall.on('close', () => { if (!done) { done = true; try { newCall.close(); } catch(e) {} showConnStatus('اشتراک صفحه وصل نشد','fail'); }});
        newCall.on('error', () => { if (!done) { done = true; try { newCall.close(); } catch(e) {} showConnStatus('اشتراک صفحه وصل نشد','fail'); }});
        setTimeout(() => { if (!done) { done = true; try { newCall.close(); } catch(e) {} showConnStatus('اشتراک صفحه وصل نشد','fail'); }}, 10000);
    }

    async function stopScreenSharing() {
        if (!isScreenSharing) return;
        if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }

        const localVid = document.querySelector('#card-local video');
        if (localVid) localVid.srcObject = myStream;
        const localCard = document.getElementById('card-local');
        if (localCard) localCard.style.transform = "";

        const camTrack = myStream.getVideoTracks()[0];
        const entries = Object.entries(connectedPeers);

        for (const [pid, call] of entries) {
            if (camTrack) {
                try {
                    const pc = call.peerConnection;
                    if (pc && pc.getSenders) {
                        const vs = pc.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (vs) { await vs.replaceTrack(camTrack); continue; }
                    }
                } catch(e) {}
            }
            // Safe recall back
            const existingCall = call;
            const nc = peer.call(pid, myStream);
            if (!nc) continue;
            let done = false;
            nc.on('stream', (rs) => {
                if (done) return; done = true;
                connectedPeers[pid] = nc;
                try { existingCall.close(); } catch(e) {}
                addVideoTrack(pid, rs, extractNameFromId(pid), false);
                setupSpeakingDetector(pid, rs);
            });
            nc.on('error', () => { if (!done) { done = true; try { nc.close(); } catch(e) {}}});
            setTimeout(() => { if (!done) { done = true; try { nc.close(); } catch(e) {}}}, 10000);
        }

        isScreenSharing = false;
        document.getElementById('btn-screen').classList.remove('active');
        hideConnStatus();
    }
</script>
